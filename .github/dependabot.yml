# Dependabot version updates.
#
# Security alerts and security updates are enabled separately in the repository
# settings; this file only governs routine version bumps.
version: 2

updates:
  # The CI workflow pins every action to a full commit SHA, which is a
  # supply-chain control but also freezes them: nothing here would ever notice a
  # new release. Dependabot rewrites both the SHA and its trailing version
  # comment, so the pins stay current without becoming mutable tags again.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before Dependabot proposes them: minor and patch
    # PRs merge themselves once CI is green, so this is the window for a
    # hijacked release to be caught and yanked upstream first. Security
    # updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'

  # Monthly and grouped, deliberately: there are only a handful of dependencies,
  # `pnpm audit --prod` already gates CI, and anything genuinely urgent arrives
  # as a security update rather than waiting for this schedule. Grouping also
  # keeps a lockfile rewrite easy to review in one diff.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # Minor and patch only. A major arrives as its own PR, so one breaking
      # bump cannot hold the routine ones back, and it stays out of auto-merge
      # for a human to read.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
